# Install as /etc/nginx/sites-available/devstack.fyi (owner only).
# TLS/Certbot paths retained from plex, read 2026-09-08.
server {
    server_name devstack.fyi www.devstack.fyi;
    root /var/www/devstack.fyi/;
    index index.html;
    expires off;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    if ($host = www.devstack.fyi) {
        return 301 https://devstack.fyi$request_uri;
    }

    error_page 404 /404.html;
    error_page 403 405 /404.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    location ^~ /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    location = /404.html {
        # Direct requests also return a real 404; error_page keeps the original status.
        internal;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/devstack.fyi/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/devstack.fyi/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name devstack.fyi www.devstack.fyi;
    listen 80;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    return 301 https://devstack.fyi$request_uri;
}
